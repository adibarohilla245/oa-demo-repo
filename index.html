<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Demo Website</title>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <nav>
            <ul class="nav-bar">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <p>This is a user-friendly demo website created to showcase the main text and CSS styling.</p>
        <div class="card">
            <h2>Card Title</h2>
            <p>This is a description of the card content. It provides additional information.</p>
            <button class="card-button">Click Me</button>
        </div>
        <section class="signup-form">
            <h2>Sign Up</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="submit-button">Sign Up</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2023 Demo Website</p>
        <p>Built by Alex the AI Intern</p>
    </footer>
    <script>
        const toggleButton = document.getElementById('dark-mode-toggle');
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
